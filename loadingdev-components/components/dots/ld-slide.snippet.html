<!-- Holo UI Vault: ld-slide (Slide Loader) -->
<!-- Style: micro_motion_indicators | Requires: loadingdev-components/shared/base.css -->
<div class="holo-ui-preview" style="display: flex; align-items: center; justify-content: center; padding: 24px;">
  <div class="ld-slide" aria-hidden="true" style="--ld-size: 24px;">
  <div class="ld-slide-dot" style="--ld-step: 0; --ld-slide-rest: translate(0, 0);"></div>
  <div class="ld-slide-dot" style="--ld-step: 1; --ld-slide-rest: translate(158.8%, 0);"></div>
  <div class="ld-slide-dot" style="--ld-step: 2; --ld-slide-rest: translate(158.8%, 158.8%);"></div>
</div>
</div>
