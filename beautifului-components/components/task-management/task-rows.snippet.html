<!--
  Component: Task Rows
  Source: https://www.beautifului.dev/#task-rows
  Description: Live agent task status with expandable details.
  Dependencies: shared/base.css, Tailwind CSS v4
-->

<div class="flex w-full max-w-110 flex-col gap-2">

  <!-- COMPLETED task row -->
  <div class="self-stretch overflow-hidden transition-[border-radius,background-color] duration-300 bg-surface shadow-card" style="border-radius:22px;animation:fade-up 450ms cubic-bezier(0.23,1,0.32,1) 0ms both">
    <button type="button" aria-expanded="false" class="flex h-11 w-full items-center gap-2.5 px-2.5 text-left">
      <!-- Checkmark icon -->
      <span class="flex size-6 shrink-0 items-center justify-center">
        <span class="flex size-5.5 shrink-0 items-center justify-center rounded-full text-white bg-green" style="animation:pop-in 300ms cubic-bezier(0.23,1,0.32,1) both">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </span>
      </span>
      <span class="min-w-0 flex-1 truncate text-[13px] font-medium text-ink">Verified vendor records</span>
      <span class="text-[12.5px] text-ink-2 tabular-nums">12 suppliers</span>
      <span class="inline-flex h-5.5 items-center rounded-full bg-green-tint px-2 text-[11.5px] font-medium text-green">Completed</span>
      <span aria-hidden="true" class="-ml-2 flex size-7 shrink-0 items-center justify-center rounded-full text-ink-3">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="transition-transform duration-300" style="transform:rotate(0)">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </span>
    </button>
  </div>

  <!-- RUNNING task row -->
  <div class="self-stretch overflow-hidden transition-[border-radius,background-color] duration-300 bg-surface shadow-card" style="border-radius:22px;animation:fade-up 450ms cubic-bezier(0.23,1,0.32,1) 80ms both">
    <button type="button" aria-expanded="false" class="flex h-11 w-full items-center gap-2.5 px-2.5 text-left">
      <!-- Spinning progress indicator -->
      <span class="flex size-6 shrink-0 items-center justify-center">
        <span class="relative inline-flex shrink-0 items-center justify-center" style="width:24px;height:24px">
          <svg width="24" height="24" class="absolute inset-0" style="animation:spin 1.1s linear infinite">
            <circle cx="12" cy="12" r="11" fill="none" stroke="var(--line)" stroke-width="2"/>
            <circle cx="12" cy="12" r="11" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-linecap="round" stroke-dasharray="19.35 49.76"/>
          </svg>
          <span class="relative text-[10.5px] font-semibold tabular-nums text-ink">2</span>
        </span>
      </span>
      <span class="min-w-0 flex-1 truncate text-[13px] font-medium text-ink">Build reorder task list</span>
      <span class="text-[12.5px] text-ink-2 tabular-nums">7 SKUs</span>
      <span aria-hidden="true" class="-ml-2 flex size-7 shrink-0 items-center justify-center rounded-full text-ink-3">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </span>
    </button>
  </div>

</div>
