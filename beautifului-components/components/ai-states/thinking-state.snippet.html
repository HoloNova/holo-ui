<!--
  Component: Thinking State
  Source: https://www.beautifului.dev/#thinking-state
  Category: ai-states
  Description: Expandable thinking traces with shimmer heading and collapsible step list.
  Dependencies: shared/base.css, Tailwind CSS v4
  Variants: Steps, Reasoning, Search, Coding
-->

<!-- Thinking State — Collapsed (default) -->
<div class="flex w-full max-w-95 flex-col">
  <!-- Toggle button -->
  <button
    type="button"
    aria-expanded="false"
    class="-mx-1.5 flex w-fit items-center gap-2 rounded-control px-1.5 py-1 transition-colors duration-100 hover:bg-hover-2"
  >
    <!-- Star icon -->
    <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--ink-2)">
      <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/>
    </svg>
    <!-- Shimmer 'Thinking' label -->
    <span role="status" class="contents">
      <span
        class="bg-clip-text text-[13px] font-medium whitespace-nowrap text-transparent"
        style="background-image:linear-gradient(90deg, var(--ink-3) 35%, var(--ink) 50%, var(--ink-3) 65%);background-size:200% 100%;animation:shimmer-text 1.4s linear infinite"
      >Thinking</span>
    </span>
    <!-- Chevron (rotates when expanded) -->
    <svg
      width="14" height="14" viewBox="0 0 24 24"
      fill="none" stroke="var(--ink-3)" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round"
      class="transition-transform duration-300"
      style="transform:rotate(0)"
    >
      <path d="M6 9l6 6 6-6"/>
    </svg>
  </button>

  <!-- Expandable content (set grid-template-rows:1fr and opacity:1 when expanded) -->
  <div
    class="grid transition-[grid-template-rows,opacity] duration-400"
    style="grid-template-rows:0fr;opacity:0;transition-timing-function:cubic-bezier(0.23, 1, 0.32, 1)"
  >
    <div class="overflow-hidden">
      <div class="relative mt-1 ml-[5px] pl-4">
        <!-- Vertical timeline line (animate height to show) -->
        <span
          aria-hidden="true"
          class="absolute left-[3px] w-px bg-line"
          style="top:-8px;height:0;transition:height 500ms cubic-bezier(0.23,1,0.32,1)"
        ></span>
        <!-- Step items -->
        <div class="flex flex-col gap-1 py-1">
          <!-- Add step items here -->
          <!-- Example step:
          <div class="flex items-start gap-2 py-0.5">
            <span class="mt-0.5 text-[12px] text-ink-3">Searching for relevant data...</span>
          </div>
          -->
        </div>
      </div>
    </div>
  </div>
</div>
