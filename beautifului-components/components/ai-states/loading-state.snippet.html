<!--
  Component: Loading State
  Source: https://www.beautifului.dev/#loading-state
  Category: ai-states
  Description: Pixel-grid loader with shimmer text and elapsed time counter.
  Dependencies: shared/base.css (for CSS vars & animations), Tailwind CSS v4
  Variants: Drive (pixel grid), Dots, Orbit, Surfer

  USAGE: Copy this snippet and include shared/base.css + Tailwind CSS.
-->

<!-- VARIANT: Drive (Pixel Grid) — Default -->
<div role="status" class="flex w-fit items-center gap-2.5">
  <!-- Pixel grid (3x3) -->
  <span aria-hidden="true" class="grid shrink-0 grid-cols-[repeat(3,4px)] gap-[1.5px]">
    <span class="size-[4px] bg-ink rounded-[1px]" style="opacity:0.15;animation:pixel-on 650ms ease-in-out 90ms infinite"></span>
    <span class="size-[4px] bg-ink rounded-[1px]" style="opacity:0.15;animation:pixel-on 650ms ease-in-out 180ms infinite"></span>
    <span class="size-[4px] bg-ink rounded-[1px]" style="opacity:0.15;animation:pixel-on 650ms ease-in-out 270ms infinite"></span>
    <span class="size-[4px] bg-ink rounded-[1px]" style="opacity:0.15;animation:pixel-on 650ms ease-in-out 0ms infinite"></span>
    <span class="size-[4px] bg-ink rounded-[1px]" style="opacity:0.15;animation:pixel-on 650ms ease-in-out 90ms infinite"></span>
    <span class="size-[4px] bg-ink rounded-[1px]" style="opacity:0.15;animation:pixel-on 650ms ease-in-out 180ms infinite"></span>
    <span class="size-[4px] bg-ink rounded-[1px]" style="opacity:0.15;animation:pixel-on 650ms ease-in-out 90ms infinite"></span>
    <span class="size-[4px] bg-ink rounded-[1px]" style="opacity:0.15;animation:pixel-on 650ms ease-in-out 180ms infinite"></span>
    <span class="size-[4px] bg-ink rounded-[1px]" style="opacity:0.15;animation:pixel-on 650ms ease-in-out 270ms infinite"></span>
  </span>
  <!-- Shimmer label -->
  <span
    class="bg-clip-text text-[13px] font-medium text-transparent"
    style="background-image:linear-gradient(90deg, var(--ink-3) 35%, var(--ink) 50%, var(--ink-3) 65%);background-size:200% 100%;animation:shimmer-text 1.4s linear infinite"
  >Churning</span>
  <!-- Elapsed time (update via JS) -->
  <span class="font-mono text-[12px] text-ink-3 tabular-nums">0.0s</span>
</div>
