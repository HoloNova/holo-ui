<!--
  Component: Streaming Text
  Source: https://www.beautifului.dev/#streaming-text
  Category: ai-states
  Description: Streaming AI response with blinking cursor, action buttons, sources, and follow-ups.
  Dependencies: shared/base.css, Tailwind CSS v4
-->

<div class="min-h-[15.5rem] w-full max-w-95">
  <!-- Streaming text paragraph with blinking cursor -->
  <p class="text-[13px] leading-relaxed text-ink">
    <!-- Text content goes here; append characters as they stream -->
    The AI assistant is generating a response
    <!-- Blinking cursor (add class 'is-streaming' to disable blink while actively streaming) -->
    <span
      class="ml-0.5 inline-block h-3 w-0.5 translate-y-0.5 rounded-full bg-ink"
      style="animation:caret-blink 1s step-end infinite"
    ></span>
  </p>

  <!-- Action toolbar (show after streaming completes) -->
  <div class="mt-2 flex items-center gap-0.5 transition-opacity duration-400" style="opacity:0;pointer-events:none">
    <!-- Copy button -->
    <button type="button" aria-label="Copy" class="flex size-6 items-center justify-center rounded-[6px] text-ink-3 transition-colors duration-100 hover:bg-hover-2 hover:text-ink-2">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="12" height="12" rx="2.5"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
    </button>
    <!-- Retry button -->
    <button type="button" aria-label="Retry" class="flex size-6 items-center justify-center rounded-[6px] text-ink-3 transition-colors duration-100 hover:bg-hover-2 hover:text-ink-2">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/>
      </svg>
    </button>
    <!-- Thumbs up -->
    <button type="button" aria-label="Helpful" class="flex size-6 items-center justify-center rounded-[6px] text-ink-3 transition-colors duration-100 hover:bg-hover-2 hover:text-ink-2">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 10v12M15 5.88L14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88z"/>
      </svg>
    </button>
    <!-- Thumbs down -->
    <button type="button" aria-label="Not helpful" class="flex size-6 items-center justify-center rounded-[6px] text-ink-3 transition-colors duration-100 hover:bg-hover-2 hover:text-ink-2">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 14V2M9 18.12L10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88z"/>
      </svg>
    </button>

    <!-- Sources toggle button -->
    <button type="button" aria-expanded="false" class="ml-1.5 flex items-center gap-1.5 rounded-[6px] px-1 py-0.5 text-left transition-colors duration-150 hover:bg-hover">
      <!-- Source avatars -->
      <span class="flex -space-x-1">
        <!-- Add source favicon images here -->
        <img src="" alt="" class="source-avatar size-3.5 rounded-full bg-surface shadow-[0_0_0_1.5px_var(--canvas)]"/>
      </span>
      <span class="text-[12px] text-ink-2">3 sources</span>
    </button>
  </div>

  <!-- Sources list (expandable) -->
  <div class="grid transition-[grid-template-rows,opacity] duration-300" style="grid-template-rows:0fr;opacity:0;transition-timing-function:cubic-bezier(0.23, 1, 0.32, 1)">
    <div class="overflow-hidden">
      <div class="mt-1.5 flex flex-col rounded-[10px] bg-inset p-1 shadow-hairline">
        <!-- Source item -->
        <a href="https://example.com" target="_blank" rel="noreferrer" class="flex items-center gap-2 rounded-[6px] px-1.5 py-1 text-[12px] text-ink-2 transition-colors duration-150 hover:bg-hover hover:text-ink">
          <img src="" alt="" class="source-avatar size-4 rounded-[4px]"/>
          <span class="animated-underline">Source Name</span>
          <span class="ml-auto font-mono text-[10.5px] text-ink-3">example.com</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Follow-up suggestions (show after streaming) -->
  <div class="mt-2.5 transition-opacity duration-400" style="opacity:0;pointer-events:none">
    <p class="text-[12px] font-medium text-ink-2">Follow-ups</p>
    <div class="mt-0.5 flex flex-col">
      <button class="-mx-1.5 flex items-center gap-2 rounded-[7px] border-b border-line px-1.5 py-1.5 text-left text-[12.5px] text-ink transition-colors duration-100 hover:bg-hover-2">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0">
          <path d="M9 10l-5 5 5 5"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/>
        </svg>
        What else should I know about this?
      </button>
    </div>
  </div>
</div>
