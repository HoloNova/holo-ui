<!--
  Component: Selection Actions
  Source: https://www.beautifului.dev/#selection-actions
  Category: interaction
  Description: Floating contextual toolbar appearing when items are selected.
  Dependencies: shared/base.css, Tailwind CSS v4
-->

<!-- Selection action bar (appears when items are selected) -->
<div
  class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50"
  style="animation:fade-up 200ms cubic-bezier(0.23,1,0.32,1) both"
>
  <div class="flex items-center gap-1 rounded-full bg-surface px-2 py-1.5 shadow-overlay">
    <!-- Selection count -->
    <span class="pl-1 pr-2 text-[12.5px] font-medium text-ink">
      <span class="tabular-nums">3</span> selected
    </span>

    <div class="h-4 w-px bg-line"></div>

    <!-- Edit action -->
    <button type="button" class="flex h-7 items-center gap-1.5 rounded-full px-2.5 text-[12.5px] text-ink-2 transition-colors duration-100 hover:bg-hover hover:text-ink">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      Edit
    </button>

    <!-- Tag action -->
    <button type="button" class="flex h-7 items-center gap-1.5 rounded-full px-2.5 text-[12.5px] text-ink-2 transition-colors duration-100 hover:bg-hover hover:text-ink">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
        <line x1="7" y1="7" x2="7.01" y2="7"/>
      </svg>
      Tag
    </button>

    <!-- Export action -->
    <button type="button" class="flex h-7 items-center gap-1.5 rounded-full px-2.5 text-[12.5px] text-ink-2 transition-colors duration-100 hover:bg-hover hover:text-ink">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Export
    </button>

    <div class="h-4 w-px bg-line"></div>

    <!-- Delete action (destructive) -->
    <button type="button" class="flex h-7 items-center gap-1.5 rounded-full px-2.5 text-[12.5px] text-red transition-colors duration-100 hover:bg-red-tint">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14H6L5 6"/>
        <path d="M10 11v6M14 11v6"/>
        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
      </svg>
      Delete
    </button>

    <div class="h-4 w-px bg-line"></div>

    <!-- Dismiss -->
    <button type="button" aria-label="Clear selection" class="flex size-7 items-center justify-center rounded-full text-ink-3 transition-colors duration-100 hover:bg-hover hover:text-ink">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>
</div>
