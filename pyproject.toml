[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holo-ui-mcp"
version = "0.0.1"
description = "Agent-First Model Context Protocol (MCP) Server for Holo UI Vault"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "HoloNova" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ui",
    "agent",
    "design-system",
    "cursor",
    "claude",
    "tailwindcss",
    "framer-motion"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/HoloNova/holo-ui"
Repository = "https://github.com/HoloNova/holo-ui.git"
Issues = "https://github.com/HoloNova/holo-ui/issues"

[project.scripts]
holo-ui-mcp = "holo_ui_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["holo_ui_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"INDEX.json" = "holo_ui_mcp/INDEX.json"
"ROUTER.json" = "holo_ui_mcp/ROUTER.json"
"FEATURE_TOKENS.md" = "holo_ui_mcp/FEATURE_TOKENS.md"
"STYLE_AND_SELECTION_GUIDE.md" = "holo_ui_mcp/STYLE_AND_SELECTION_GUIDE.md"
"beautifului-components" = "holo_ui_mcp/beautifului-components"
"rewampui-components" = "holo_ui_mcp/rewampui-components"
"loadingdev-components" = "holo_ui_mcp/loadingdev-components"
"guidelines" = "holo_ui_mcp/guidelines"

[tool.hatch.build.targets.sdist]
include = [
    "INDEX.json",
    "ROUTER.json",
    "FEATURE_TOKENS.md",
    "STYLE_AND_SELECTION_GUIDE.md",
    "beautifului-components",
    "rewampui-components",
    "loadingdev-components",
    "guidelines",
    "holo_ui_mcp",
    "tools",
    "README.md",
    "README_zh.md",
    "pyproject.toml"
]
